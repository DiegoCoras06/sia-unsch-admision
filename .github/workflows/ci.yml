# Integración continua: en cada push y pull request se compilan los contratos, el backend y el frontend,
# y se corren las pruebas del backend con PostgreSQL embebido (sin RDS ni claves).
# El despliegue continuo (CD) a AWS se realizará recién en el Sprint 3.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tipos y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: npm del proyecto (packageManager)
        run: npm install -g npm@11.19.0
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar contratos
        run: npm run build -w @sia/contracts
      - name: Revisar fronteras y calidad estatica
        run: npm run lint
      - name: Revisar tipos del backend
        run: npm run typecheck -w @sia/backend
      - name: Compilar funciones Lambda del backend
        run: npm run build -w @sia/backend
      - name: Pruebas del backend con cobertura
        run: npm run test:coverage -w @sia/backend
      - name: Resumen de cobertura en la página del CI
        if: always()
        run: |
          node -e "
            const t = require('./apps/backend/coverage/coverage-summary.json').total;
            const fila = (n, k) => '| ' + n + ' | ' + t[k].pct + ' % | ' + t[k].covered + ' de ' + t[k].total + ' |';
            console.log(['## Cobertura de pruebas del backend', '', '| Medida | Cobertura | Cubierto |', '|---|---|---|',
              fila('Líneas', 'lines'), fila('Sentencias', 'statements'), fila('Funciones', 'functions'), fila('Ramas', 'branches')].join(String.fromCharCode(10)));
          " >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: apps/backend/coverage/
          retention-days: 30

  frontend:
    name: Frontend (compilación)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: npm del proyecto (packageManager)
        run: npm install -g npm@11.19.0
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar contratos
        run: npm run build -w @sia/contracts
      - name: Compilar Angular
        run: npm run build -w @sia/frontend
      - name: Compilar Worker Lambda del backend
        run: npm run build -w @sia/backend
      - name: Revisar tipos de la infraestructura CDK
        run: npm run typecheck -w @sia/infra
      - name: Probar la plantilla CloudFront
        run: npm run test -w @sia/infra
      - name: Sintetizar CloudFormation sin desplegar
        run: npm run synth -w @sia/infra

  e2e:
    name: E2E (PostgreSQL + API + Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sia_e2e
          POSTGRES_PASSWORD: sia_e2e_only
          POSTGRES_DB: sia_e2e
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U sia_e2e -d sia_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://sia_e2e:sia_e2e_only@127.0.0.1:5435/sia_e2e
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: npm del proyecto (packageManager)
        run: npm install -g npm@11.19.0
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar contratos
        run: npm run build -w @sia/contracts
      - name: Ejecutar flujo E2E aislado
        run: npm run test:e2e
      - name: Guardar reporte y capturas E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-e2e
          path: .e2e-artifacts/
          retention-days: 30
          include-hidden-files: true
