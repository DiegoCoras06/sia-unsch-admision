openapi: 3.1.0
info:
  title: SIA-UNSCH — Pagos en línea (spec 005)
  version: 0.2.0
  description: >-
    Pagos con Culqi: tarjeta y Yape en el mismo formulario (ADR-024). El postulante se identifica con DNI + código
    de postulante (ADR-015). El navegador obtiene un token en Culqi Checkout y el servidor crea el cargo.
    Respuestas con el sobre {data} / {error} de la API.
servers:
  - url: /api/v1
paths:
  /payments/session:
    post:
      summary: Abre un intento de pago y devuelve la llave pública y el monto para Culqi Checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicantAuth' }
      responses:
        '201':
          description: Intento creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentSession' }
        '404': { description: DNI y código no coinciden }
        '409': { description: 'ALREADY_PAID: la orden ya está pagada' }
        '422': { description: 'PAYMENT_NOT_REQUIRED o DOSSIER_NOT_AUTHORIZED: la inscripción no puede pagar todavía' }
        '429': { description: Demasiados intentos }
  /payments/charge:
    post:
      summary: Cobra el token que entregó Culqi Checkout (tarjeta tkn_… o Yape ype_…)
      description: >-
        El servidor crea el cargo en Culqi con su llave secreta; la respuesta del cargo, servidor a servidor,
        es el resultado del pago. Monto y moneda se comparan con la orden y un intento se cobra una sola vez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/ApplicantAuth' }
                - type: object
                  required: [transactionId, token]
                  properties:
                    transactionId: { type: string }
                    token: { type: string, example: tkn_test_abc123 }
      responses:
        '200':
          description: Resultado del intento
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AttemptResult' }
        '400': { description: 'VALIDATION_ERROR (token que no es de la pasarela) o PAYMENT_MISMATCH (monto o moneda distintos)' }
        '404': { description: El intento no existe o es de otro postulante }
        '409': { description: 'ATTEMPT_IN_USE: el intento ya se está cobrando o ya se cobró' }
        '422': { description: 'ATTEMPT_EXPIRED o YAPE_LIMIT (Yape acepta hasta S/ 2000)' }
        '502': { description: 'GATEWAY_UNAVAILABLE: Culqi no respondió; el intento queda en proceso para Tesorería' }
  /payments/status:
    get:
      summary: Estado de la orden e historial de intentos
      parameters:
        - { name: documentNumber, in: query, required: true, schema: { type: string } }
        - { name: applicantCode, in: query, required: true, schema: { type: string, pattern: '^\d{8}$' } }
      responses:
        '200':
          description: Orden e intentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentStatus' }
components:
  schemas:
    ApplicantAuth:
      type: object
      required: [documentNumber, applicantCode]
      properties:
        documentNumber: { type: string, minLength: 6, maxLength: 12 }
        applicantCode: { type: string, pattern: '^\d{8}$' }
    PaymentSession:
      type: object
      required: [provider, environment, publicKey, transactionId, orderNumber, amount, amountCents, currency, yape]
      properties:
        provider: { type: string, enum: [culqi, mock] }
        environment: { type: string, enum: [sandbox, production, simulated] }
        publicKey: { type: string, description: 'Llave pública de Culqi (pk_test_… o pk_live_…); nunca la secreta' }
        transactionId: { type: string }
        orderNumber: { type: string }
        amount: { type: string, example: '250.00' }
        amountCents: { type: integer, example: 25000 }
        currency: { type: string, enum: [PEN] }
        yape: { type: boolean, description: 'Yape disponible para este monto (hasta S/ 2000)' }
    AttemptResult:
      type: object
      properties:
        transactionId: { type: string }
        status: { type: string, enum: [INICIADO, AUTORIZADO, RECHAZADO, VENCIDO, DUPLICADO] }
        label: { type: string }
        message: { type: [string, 'null'] }
        orderStatus: { type: string, enum: [PENDIENTE, PAGADA] }
    PaymentStatus:
      type: object
      properties:
        provider: { type: string, enum: [culqi, mock] }
        environment: { type: string }
        order:
          type: object
          properties:
            orderNumber: { type: [string, 'null'] }
            amount: { type: string }
            status: { type: string, enum: [PENDIENTE, PAGADA] }
            paidAt: { type: [string, 'null'], format: date-time }
            receipt:
              type: [object, 'null']
              description: Constancia de pago (no es comprobante electrónico SUNAT)
              properties:
                operationNumber: { type: [string, 'null'] }
                authorizationCode: { type: [string, 'null'] }
                payMethod: { type: [string, 'null'], enum: [CARD, YAPE, null] }
                cardMasked: { type: [string, 'null'], example: 'Visa 411111******1111' }
        attempts:
          type: array
          items:
            type: object
            properties:
              transactionId: { type: string }
              orderNumber: { type: string }
              status: { type: string }
              label: { type: string }
              message: { type: [string, 'null'] }
              payMethod: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
        yapeMaxAmount: { type: string, example: '2000.00' }
